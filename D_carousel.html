<html>

<head>
    <title>Bootstrap carausel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- carousel start -->

    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item ">
                <img src="source2/12.webp" class="d-block w-100 h-50">
            </div>

            <div class="carousel-item active">
                <img src="source2/14.jpg" class="d-block w-100 h-50">
            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">
            Prev
        </button>
        <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
            Next
        </button>
    </div>

      <!-- carousel end -->

    <div class="js-config">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>

</html>
