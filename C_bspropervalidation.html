<html>

<head>
  <title>BS forms - validation </title>
  <meta name="viewport" content="width=device-width initial-scale=1.0" />
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://maps.googleapis.com/maps/api/js"></script>
</head>

<body>


  <div class="container">
    <div class="text-primary fs-4  text-center m-3 p-3">Form Validations</div>

    <form class="needs-validation" novalidate>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" required>
        <div class="invalid-feedback">
          Please enter a valid email.
        </div>
      </div>

      <div>
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" required minLength="3" maxlength="5">
        <div class="invalid-feedback">
          Please provide your password.
        </div>
      </div>

      <button class="btn btn-primary mt-3">Submit</button>

    </form>
  </div>


  <div>
    <gmp-map
            center="12.984613,80.216222"
            zoom="10"
            map-id="DEMO_MAP_ID"
            style="height: 500px"></gmp-map>
  </div>



  <script>

    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');

      forms.forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          event.preventDefault();
          form.classList.add('was-validated');
        });
      });
    })();

  </script>

</body>

</html>
